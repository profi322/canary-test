<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 13px system-ui, monospace; max-width: 40rem; margin: 1rem auto; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 12px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; }
</style>
</head>
<body>
<h1>Sign in to your account</h1>
<form id="login-form" autocomplete="on">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <label>Cardholder name <input type="text" name="cc-name" id="cc-name" autocomplete="cc-name"></label>
  <label>Card number <input type="text" name="cc-number" id="cc-number" autocomplete="cc-number"></label>
  <label>Expiry <input type="text" name="cc-exp" id="cc-exp" autocomplete="cc-exp"></label>
  <label>CVC <input type="text" name="cc-csc" id="cc-csc" autocomplete="cc-csc"></label>
  <label>Street address <input type="text" name="address" id="address" autocomplete="street-address"></label>
  <label>Phone <input type="tel" name="phone" id="phone" autocomplete="tel"></label>
  <label>Email <input type="email" name="email2" id="email2" autocomplete="email"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
function log(msg) { events.push(msg); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  window.scrollTo(0, document.body.scrollHeight);
}
var ids = ["username","password","cc-name","cc-number","cc-exp","cc-csc","address","phone","email2"];
document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  ids.forEach(function (id) {
    var v = document.getElementById(id).value;
    log(id + ": " + JSON.stringify(v));
  });
});
setInterval(render, 1000);
render();
</script>
</body>
</html>
