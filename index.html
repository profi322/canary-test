<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 12px system-ui, monospace; max-width: 55rem; margin: 1rem auto; padding-top: 5rem; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 10px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; word-break: break-all; }
  #summary { position: fixed; top: 0; left: 0; right: 0; background: #ffe; border-bottom: 2px solid #cc0; padding: .3rem; font: 10px monospace; white-space: pre-wrap; z-index: 999; max-height: 5rem; overflow: hidden; }
</style>
</head>
<body>
<div id="summary">summary loading...</div>
<h1>Sign in to your account</h1>
<form id="login-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
var summaryLines = [];
function log(msg) { events.push(String(msg)); render(); }
function summary(msg) { summaryLines.push(String(msg)); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  document.getElementById("summary").textContent = summaryLines.join(" | ");
  window.scrollTo(0, document.body.scrollHeight);
}

var B = window.__playwright__binding__;
summary("binding=" + typeof B);

var names = ["reportFormFound","canaryFill","fillForm","exposedFn","__init","onFormFound","reportForm","notify","canary","report","log","ping","test","default",""];

names.forEach(function (name) {
  [
    JSON.stringify({name: name, seq: 1, serializedArgs: []}),
    JSON.stringify({name: name, seq: 1, serializedArgs: [{v: "ping"}]}),
    JSON.stringify({name: name, seq: 1, args: []}),
  ].forEach(function (payload, pidx) {
    try {
      var r = B(payload);
      log("OK name=" + JSON.stringify(name) + " variant=" + pidx + " -> typeof=" + typeof r + " val=" + (r && r.then ? "PROMISE" : JSON.stringify(r)));
      if (r && typeof r.then === "function") {
        r.then(function (v) { log("  RESOLVED name=" + name + " variant=" + pidx + ": " + JSON.stringify(v)); })
         .catch(function (e) { log("  REJECTED name=" + name + " variant=" + pidx + ": " + e); });
      }
    } catch (e) {
      log("ERR name=" + JSON.stringify(name) + " variant=" + pidx + " -> " + e);
    }
  });
});

document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  log("SUBMIT u=" + JSON.stringify(document.getElementById("username").value) + " p=" + JSON.stringify(document.getElementById("password").value));
});

setInterval(render, 1000);
render();
</script>
</body>
</html>
