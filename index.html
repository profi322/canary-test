<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>body { font: 12px system-ui; max-width: 55rem; margin: 1rem auto; }</style>
</head>
<body>
<h1>Sign in to your account</h1>
<form id="login-form" method="post" action="https://httpbin.org/anything">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
