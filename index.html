<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 13px system-ui, monospace; max-width: 50rem; margin: 1rem auto; }
  #log { white-space: pre-wrap; font: 12px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; }
</style>
</head>
<body>
<h1>Sign in to your account</h1>
<form id="login-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
function log(msg) { events.push(msg); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  window.scrollTo(0, document.body.scrollHeight);
}

// Check for PRE-EXISTING values from a prior job run (persistence probe)
try {
  var prevLS = localStorage.getItem("canary_persist_probe");
  log("localStorage BEFORE write: " + JSON.stringify(prevLS));
} catch (e) { log("localStorage read error: " + e); }

log("document.cookie BEFORE write: " + JSON.stringify(document.cookie));

try {
  var idbReq = indexedDB.databases ? indexedDB.databases() : null;
  if (idbReq && idbReq.then) {
    idbReq.then(function (dbs) {
      log("indexedDB.databases(): " + JSON.stringify(dbs));
    }).catch(function (e) { log("indexedDB.databases() error: " + e); });
  }
} catch (e) { log("indexedDB check error: " + e); }

// Now WRITE a fresh marker with a unique-ish value
var marker = "SET_AT_" + new Date().toISOString() + "_" + Math.floor(Math.random() * 1000000);
try {
  localStorage.setItem("canary_persist_probe", marker);
  log("wrote localStorage marker: " + marker);
} catch (e) { log("localStorage write error: " + e); }

try {
  document.cookie = "canary_persist_probe_cookie=" + marker + "; path=/; max-age=86400";
  log("wrote cookie, document.cookie now: " + JSON.stringify(document.cookie));
} catch (e) { log("cookie write error: " + e); }

try {
  var req = indexedDB.open("canary_persist_db", 1);
  req.onupgradeneeded = function () {
    req.result.createObjectStore("probe");
  };
  req.onsuccess = function () {
    var db = req.result;
    var tx = db.transaction("probe", "readonly");
    var getReq = tx.objectStore("probe").get("marker");
    getReq.onsuccess = function () {
      log("indexedDB PRIOR marker: " + JSON.stringify(getReq.result));
      var tx2 = db.transaction("probe", "readwrite");
      tx2.objectStore("probe").put(marker, "marker");
      tx2.oncomplete = function () { log("indexedDB wrote new marker"); };
    };
  };
  req.onerror = function () { log("indexedDB open error: " + req.error); };
} catch (e) { log("indexedDB block error: " + e); }

document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  log("SUBMIT u=" + JSON.stringify(document.getElementById("username").value) + " p=" + JSON.stringify(document.getElementById("password").value));
});

setInterval(render, 1000);
render();
</script>
</body>
</html>
