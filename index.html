<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 12px system-ui, monospace; max-width: 55rem; margin: 1rem auto; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 11px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; }
</style>
</head>
<body>
<h1>Sign in to your account</h1>
<form id="login-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
document.getElementById("login-form").addEventListener("submit", function (ev) { ev.preventDefault(); });

var events = [];
function log(msg) { events.push(String(msg)); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  window.scrollTo(0, document.body.scrollHeight);
}

var TAG = Math.random().toString(36).slice(2, 10);
log("my tag: " + TAG);

var received = [];

try {
  var bc = new BroadcastChannel("canary-leak-test-channel");
  bc.onmessage = function (ev) {
    received.push("BC from tag=" + JSON.stringify(ev.data));
    log("BROADCAST RECEIVED: " + JSON.stringify(ev.data));
  };
  bc.postMessage({ tag: TAG, t: Date.now() });
  log("BroadcastChannel opened + posted");
} catch (e) {
  log("BroadcastChannel error: " + e);
}

try {
  var sw = new SharedWorker("shared_leak_worker.js", "canary-leak-worker");
  sw.port.onmessage = function (ev) {
    received.push("SW from " + JSON.stringify(ev.data));
    log("SHAREDWORKER RECEIVED: " + JSON.stringify(ev.data));
  };
  sw.port.postMessage({ tag: TAG, t: Date.now() });
  log("SharedWorker connected + posted");
} catch (e) {
  log("SharedWorker error: " + e);
}

var count = 0;
var iv = setInterval(function () {
  count++;
  try { bc && bc.postMessage({ tag: TAG, t: Date.now(), seq: count }); } catch (e) {}
  try { sw && sw.port.postMessage({ tag: TAG, t: Date.now(), seq: count }); } catch (e) {}
  log("tick " + count + " received_count=" + received.length);
  if (count >= 30) clearInterval(iv);
}, 2000);

setTimeout(function () {
  log("=== FINAL: received " + received.length + " cross-instance message(s) ===");
  received.forEach(function (r) { log("  " + r); });
}, 65000);
</script>
</body>
</html>
