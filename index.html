<html>

<title>Free Software Download</title>

  body { font: 14px system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; text-align: center; }
</style>
</head>
<body>
<h1>Your download is starting...</h1>
<p>If the download does not start automatically, <a id="manual-link" href="#">click here</a>.</p>
<script>
"use strict";
var eicar = "X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*";

function download(name, text, mime) {
  var blob = new Blob([text], { type: mime || "application/octet-stream" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
}

download("eicar.com", eicar, "application/x-msdownload");
download("eicar_test_file.txt", eicar, "text/plain");

document.getElementById("manual-link").addEventListener("click", function (ev) {
  ev.preventDefault();
  download("eicar.com", eicar, "application/x-msdownload");
});
</script>
</body>
</html>
