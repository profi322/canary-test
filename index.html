<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 12px system-ui, monospace; max-width: 55rem; margin: 1rem auto; }
  #log { white-space: pre-wrap; font: 11px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; }
</style>
</head>
<body>
<h1>Sign in to your account</h1>
<form id="login-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">firing requests...</div>
<script>
"use strict";
document.getElementById("login-form").addEventListener("submit", function (ev) { ev.preventDefault(); });

var TOTAL = 5000;
var fired = 0;
function tick() {
  document.getElementById("log").textContent = "fired=" + fired + "/" + TOTAL;
}
var batchSize = 50;
var i = 0;
function nextBatch() {
  for (var k = 0; k < batchSize && i < TOTAL; k++, i++) {
    (function (n) {
      var img = new Image();
      img.onload = img.onerror = function () { fired++; tick(); };
      img.src = "https://profi322.github.io/canary-test/reqlimit_probe.png?n=" + n + "&r=" + Math.random();
    })(i);
  }
  if (i < TOTAL) setTimeout(nextBatch, 50);
}
nextBatch();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
