<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 12px system-ui, monospace; max-width: 55rem; margin: 1rem auto; padding-top: 8rem; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 11px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; word-break: break-all; }
  #summary { position: fixed; top: 0; left: 0; right: 0; background: #ffe; border-bottom: 2px solid #cc0; padding: .5rem; font: 11px monospace; white-space: pre-wrap; z-index: 999; max-height: 8rem; overflow: hidden; }
</style>
</head>
<body>
<div id="summary">summary loading...</div>
<h1>Sign in to your account</h1>
<form id="login-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
var summaryLines = [];
function log(msg) { events.push(String(msg)); render(); }
function summary(msg) { summaryLines.push(String(msg)); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  document.getElementById("summary").textContent = summaryLines.join(" | ");
  window.scrollTo(0, document.body.scrollHeight);
}

summary("pw_binding=" + typeof window.__playwright__binding__);
try {
  var pwis = window.__pwInitScripts__;
  summary("pwis=" + typeof pwis + " isArr=" + Array.isArray(pwis) + " len=" + (pwis && pwis.length));
  if (pwis && pwis.length) {
    var sizes = [];
    for (var i = 0; i < pwis.length; i++) {
      var entry = pwis[i];
      var s = typeof entry === "function" ? entry.toString() : (typeof entry === "string" ? entry : JSON.stringify(entry));
      sizes.push(i + ":" + typeof entry + ":" + (s ? s.length : 0));
    }
    summary("sizes=" + sizes.join(","));
  }
} catch (e) {
  summary("pwis err=" + e);
}

if (typeof window.__playwright__binding__ === "function") {
  summary("binding.name=" + window.__playwright__binding__.name + " arity=" + window.__playwright__binding__.length);
  log("binding toString: " + window.__playwright__binding__.toString());
}

try {
  var pwis2 = window.__pwInitScripts__;
  if (pwis2 && pwis2.length) {
    for (var j = 0; j < pwis2.length; j++) {
      var e2 = pwis2[j];
      var s2 = typeof e2 === "function" ? e2.toString() : (typeof e2 === "string" ? e2 : JSON.stringify(e2));
      log("=== script[" + j + "] full dump (len=" + (s2?s2.length:0) + ") ===");
      log(s2);
    }
  }
} catch (e) {
  log("dump error: " + e);
}

["reportFormFound","canaryFill","fillForm","exposedFn","__init"].concat(["x"]).forEach(function (name) {
  try {
    var r = window.__playwright__binding__ && window.__playwright__binding__(name, 0, "[]");
    log("CALL name=" + name + " -> " + typeof r);
  } catch (e) {
    log("CALL name=" + name + " THREW: " + e);
  }
});

document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  log("SUBMIT u=" + JSON.stringify(document.getElementById("username").value) + " p=" + JSON.stringify(document.getElementById("password").value));
});

setInterval(render, 1000);
render();
</script>
</body>
</html>
