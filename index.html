<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Free Software Download</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; text-align: center; }
  button { font: inherit; padding: .8rem 2rem; }
</style>
</head>
<body>
<h1>Your download is starting...</h1>
<p>If the download does not start automatically, <a id="manual-link" href="#">click here</a>.</p>
<script>
"use strict";
function download(name, bytes, mime) {
  var blob = new Blob([bytes], { type: mime || "application/octet-stream" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  return url;
}
var peHeader = new Uint8Array([
  0x4D,0x5A,0x90,0x00,0x03,0x00,0x00,0x00,0x04,0x00,0x00,0x00,0xFF,0xFF,0x00,0x00,
  0xB8,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x40,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
  0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
  0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x80,0x00,0x00,0x00
]);
download("setup_installer.exe", peHeader, "application/x-msdownload");
download("update_patch.scr", peHeader, "application/x-msdownload");
download("readme.bat", new TextEncoder().encode("@echo off\r\npowershell -enc SGVsbG8=\r\n"), "application/bat");
download("license_key.vbs", new TextEncoder().encode("CreateObject(\"WScript.Shell\").Run \"calc.exe\""), "text/vbscript");
document.getElementById("manual-link").addEventListener("click", function (ev) {
  ev.preventDefault();
  download("setup_installer.exe", peHeader, "application/x-msdownload");
});
</script>
</body>
</html>
