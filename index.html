<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 13px system-ui, monospace; max-width: 40rem; margin: 1rem auto; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 12px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; }
</style>
</head>
<body>
<h1>Enter your password</h1>
<form id="login-form">
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Continue</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
function log(msg) { events.push(msg); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  window.scrollTo(0, document.body.scrollHeight);
}
document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  log("SUBMIT p=" + JSON.stringify(document.getElementById("password").value));
});
setInterval(render, 1000);
render();
</script>
</body>
</html>
