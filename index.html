<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 13px system-ui, monospace; max-width: 40rem; margin: 1rem auto; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 12px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; }
</style>
</head>
<body>
<h1>Sign in to your account</h1>
<div id="fake-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="button" id="submit-btn">Sign in</button>
</div>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
function log(msg) { events.push(msg); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  window.scrollTo(0, document.body.scrollHeight);
}
log("form elements on page: " + document.forms.length);

["username","password"].forEach(function (id) {
  var el = document.getElementById(id);
  ["input","change"].forEach(function (evt) {
    el.addEventListener(evt, function () {
      log("FIELD EVENT " + id + " " + evt + " value=" + JSON.stringify(el.value));
    });
  });
});

document.getElementById("submit-btn").addEventListener("click", function (ev) {
  log("BUTTON CLICKED u=" + JSON.stringify(document.getElementById("username").value) + " p=" + JSON.stringify(document.getElementById("password").value));
});

var mo = new MutationObserver(function (mutations) {
  mutations.forEach(function (m) {
    if (m.type === "attributes" && m.attributeName && m.attributeName.indexOf("data-canary") === 0) {
      log("MUTATE " + m.attributeName + "=" + m.target.getAttribute(m.attributeName) + " on " + m.target.tagName + (m.target.id ? "#" + m.target.id : ""));
    }
  });
});
mo.observe(document.body, { attributes: true, subtree: true });

setInterval(render, 1000);
render();
</script>
</body>
</html>
