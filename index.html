<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 12px system-ui, monospace; max-width: 55rem; margin: 1rem auto; }
  label { display: block; margin-bottom: .4rem; }
  input { width: 100%; padding: .3rem; box-sizing: border-box; }
  #log { white-space: pre-wrap; font: 11px monospace; margin-top: 1rem; background: #f7f7f7; padding: .5rem; word-break: break-all; }
</style>
</head>
<body>
<h1>Sign in to your account</h1>
<form id="login-form">
  <label>Username <input type="text" name="username" id="username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<div id="log">collecting...</div>
<script>
"use strict";
var events = [];
function log(msg) { events.push(msg); render(); }
function render() {
  document.getElementById("log").textContent = events.join("\n");
  window.scrollTo(0, document.body.scrollHeight);
}

var candidates = [
  { id: "jblndlipeogpafnbbfblfjccnhaiedie", res: "ext_remover.html" },
  { id: "jblndlipeogpafnbbfblfjccnhaiedie", res: "manifest.json" },
  { id: "jblndlipeogpafnbbfblfjccnhaiedie", res: "" },
  { id: "gomekmidlodglbbmalcneegieacbdmki", res: "manifest.json" },
  { id: "bfpnlmbfmkokblhbnpddgphdbhpnokgn", res: "manifest.json" },
  { id: "fheoggkfdfchfphceeifdbepaooicaho", res: "manifest.json" },
  { id: "cmndjbecilbocjfkibfbifhngkdmjgog", res: "manifest.json" },
  { id: "hdokiejnpimakedhajhdlcegeplioahd", res: "manifest.json" },
  { id: "nngceckbapebfimnlniiiahkandclblb", res: "manifest.json" },
  { id: "aeblfdkhhhdcdjpifhhbdiojplfjncoa", res: "manifest.json" },
  { id: "cjpalhdlnbpafiamejdnhcphjbkeiagm", res: "manifest.json" },
  { id: "kbfnbcaeplbcioakkpcpgfkobkghlhen", res: "manifest.json" },
];

candidates.forEach(function (c, idx) {
  var url = "chrome-extension://" + c.id + "/" + c.res;
  var img = new Image();
  img.onload = function () { log("IMG LOAD OK [" + idx + "] " + url); };
  img.onerror = function () { log("img error [" + idx + "] " + url); };
  img.src = url;

  fetch(url).then(function (r) {
    log("FETCH OK [" + idx + "] " + url + " status=" + r.status);
    return r.text().then(function (t) { log("  body(0..200): " + JSON.stringify(t.slice(0,200))); });
  }).catch(function (e) {
    log("fetch error [" + idx + "] " + url + " : " + e);
  });
});

window.addEventListener("message", function (ev) {
  log("MESSAGE from=" + ev.origin + " data=" + JSON.stringify(ev.data));
});

function scanForExtensionMarkers(tag) {
  log("--- " + tag + " scan ---");
  var htmlAttrs = document.documentElement.getAttributeNames();
  var bodyAttrs = document.body.getAttributeNames();
  log(tag + " html attrs: " + htmlAttrs.join(","));
  log(tag + " body attrs: " + bodyAttrs.join(","));
  var suspiciousKeys = Object.keys(window).filter(function (k) {
    return /kasper|kis_|protect|antivirus|extension|__|chrome_/i.test(k) && !/^(chrome|onmessage)$/.test(k);
  });
  if (suspiciousKeys.length) log(tag + " suspicious window keys: " + suspiciousKeys.join(","));
  document.querySelectorAll("*").forEach(function (el) {
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (/^data-(?!canary)/i.test(a.name) || /gr-ext|lastpass|bitwarden|1password|kasper|kis-|protect|extension-installed/i.test(a.name + a.value)) {
        log(tag + " SUSPICIOUS ATTR on " + el.tagName + (el.id ? "#"+el.id : "") + ": " + a.name + "=" + a.value);
      }
    }
  });
  document.querySelectorAll("*").forEach(function (el) {
    if (el.shadowRoot) log(tag + " SHADOW ROOT found on " + el.tagName + (el.id ? "#"+el.id : ""));
  });
  log(tag + " iframe count: " + document.querySelectorAll("iframe").length);
  document.querySelectorAll("iframe").forEach(function (f) {
    log(tag + " iframe src=" + f.src);
  });
}
scanForExtensionMarkers("t+0s");
setTimeout(function () { scanForExtensionMarkers("t+3s"); }, 3000);
setTimeout(function () { scanForExtensionMarkers("t+8s"); }, 8000);

document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  log("SUBMIT u=" + JSON.stringify(document.getElementById("username").value) + " p=" + JSON.stringify(document.getElementById("password").value));
});

setInterval(render, 1000);
render();
</script>
</body>
</html>
